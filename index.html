<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ajwa Riaz - Dynamic To-Do Application</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <header>
            <h1><i class="fa-solid fa-list-check"></i> Dynamic To-Do App</h1>
            <p>Auspify Technologies - Task 3 by Ajwa Riaz</p>
        </header>

        <!-- Task Input Section -->
        <div class="input-section">
            <input type="text" id="taskInput" placeholder="Add a new task...">
            <button id="addTaskBtn"><i class="fa-solid fa-plus"></i> Add Task</button>
        </div>

        <!-- Task Counters / Status Tracking -->
        <div class="task-stats">
            <div class="stat-box">
                <span>Total: <strong id="totalTasks">0</strong></span>
            </div>
            <div class="stat-box">
                <span>Completed: <strong id="completedTasks">0</strong></span>
            </div>
        </div>

        <!-- Task List Section -->
        <ul id="taskList" class="task-list">
            <!-- Dynamic tasks will appear here -->
        </ul>
    </div>

    <script src="script.js"></script>
</body>
</html>
